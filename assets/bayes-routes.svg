<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="690" height="655" viewBox="0 0 690 655" role="img" aria-labelledby="title desc">
<title id="title">The same goal, different paths</title>
<desc id="desc">Two individual Bayes lessons share a goal. Learner A correctly gives 30 as the denominator when 9 of 30 students wear glasses, but cannot name the denominator for disease among people who test positive. In A’s second plan, circling the conditioning group is the first step; this and turning rates into counts are both prerequisites to the goal. Learner B knows the false-positive rate is out of people without disease, can find 5 percent of 200 as 10, but is unsure how to turn 5 percent of 990 into a count. B’s second plan starts by building a frequency table for 1,000 people, then practices 5 percent of 990 in two consecutive steps: subtracting 10 from 1,000 and scaling up to 10,000 people. The practice box summarizes both steps. The plan then combines true and false positives and reads the disease proportion among positives while distinguishing three conditional probabilities. These are planned steps, not claims that teaching is complete.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#173f5b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#c44734" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Segoe UI, Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
