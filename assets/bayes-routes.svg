<path d="M240 54 Q346 57 450 54" stroke="#c44734" stroke-width="2.1" fill="none" stroke-linecap="round"/>
</g>
<path d="M335 85 L335 493" fill="none" stroke="#173f5b" stroke-width="1.3" stroke-dasharray="5 8" opacity=".25"/>
<g id="learner-a">
<text x="46" y="102" font-size="25" font-weight="700" fill="#173f5b" text-anchor="start" >Learner A</text>
<text x="190" y="100" font-size="14" font-weight="700" fill="#c44734" text-anchor="start" >PLAN V2</text>
<path d="M46 109 Q105 111 164 109" stroke="#c44734" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="46" y="141" font-size="21" font-weight="400" fill="#173f5b" text-anchor="start" >9 of 30: denominator 30.</text>
<text x="46" y="165" font-size="21" font-weight="400" fill="#173f5b" text-anchor="start" >Unsure who counts</text>
<text x="46" y="189" font-size="21" font-weight="400" fill="#173f5b" text-anchor="start" >after a positive test.</text>
<path d="M52 236 Q114 232 167 235 L290 234 Q297 235 296 242 L298 302 Q297 308 291 308 L52 310 Q45 309 47 302 L46 243 Q45 237 52 236 Z" fill="#fffdf5" stroke="#173f5b" stroke-width="2.2" stroke-linejoin="round"/>
<text x="62" y="254" font-size="15" font-weight="700" fill="#c44734" text-anchor="start" letter-spacing="0.4">FIRST STEP</text>
<text x="62" y="278" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >Identify the group</text>
<text x="62" y="302" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >in the question</text>
<path d="M52 363 Q114 359 167 362 L290 361 Q297 362 296 369 L298 412 Q297 418 291 418 L52 420 Q45 419 47 412 L46 370 Q45 364 52 363 Z" fill="#fffdf5" stroke="#173f5b" stroke-width="2.2" stroke-linejoin="round"/>
<text x="62" y="385" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >Turn rates</text>
<text x="62" y="410" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >into counts</text>
<g fill="none" stroke="#173f5b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
 <path d="M298 272 C311 272 315 281 315 294 L315 480 Q315 498 328 504 L345 511"/>
 <path d="M298 390 L315 390"/>
</g>
<circle cx="315" cy="390" r="3.5" fill="#c44734"/>
</g>
<g id="learner-b">
<text x="355" y="102" font-size="25" font-weight="700" fill="#173f5b" text-anchor="start" >Learner B</text>
<text x="500" y="100" font-size="14" font-weight="700" fill="#c44734" text-anchor="start" >PLAN V2</text>
<path d="M355 109 Q414 111 473 109" stroke="#c44734" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<text x="355" y="141" font-size="21" font-weight="400" fill="#173f5b" text-anchor="start" >Knows false-positive rate</text>
<text x="355" y="165" font-size="21" font-weight="400" fill="#173f5b" text-anchor="start" >is for people without disease.</text>
<text x="355" y="189" font-size="21" font-weight="400" fill="#173f5b" text-anchor="start" >5% of 200 → 10, but 5% of</text>
<text x="355" y="213" font-size="21" font-weight="400" fill="#173f5b" text-anchor="start" >990 is still uncertain.</text>
<path d="M361 236 Q423 232 476 235 L599 234 Q606 235 605 242 L607 302 Q606 308 600 308 L361 310 Q354 309 356 302 L355 243 Q354 237 361 236 Z" fill="#fffdf5" stroke="#173f5b" stroke-width="2.2" stroke-linejoin="round"/>
<text x="371" y="254" font-size="15" font-weight="700" fill="#c44734" text-anchor="start" letter-spacing="0.4">FIRST STEP</text>
<text x="371" y="278" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >Build a table for</text>
<text x="371" y="302" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >1,000 people</text>
<path d="M361 332 Q423 328 476 331 L599 330 Q606 331 605 338 L607 398 Q606 404 600 404 L361 406 Q354 405 356 398 L355 339 Q354 333 361 332 Z" fill="#fffdf5" stroke="#173f5b" stroke-width="2.2" stroke-linejoin="round"/>
<text x="371" y="350" font-size="15" font-weight="700" fill="#c44734" text-anchor="start" letter-spacing="0.4">PRACTICE FOCUS</text>
<text x="371" y="374" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >5% of 990:</text>
<text x="371" y="398" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >990 = 1,000 − 10</text>
<path d="M361 428 Q423 424 476 427 L599 426 Q606 427 605 434 L607 477 Q606 483 600 483 L361 485 Q354 484 356 477 L355 435 Q354 429 361 428 Z" fill="#fffdf5" stroke="#173f5b" stroke-width="2.2" stroke-linejoin="round"/>
<text x="371" y="450" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >Combine true +</text>
<text x="371" y="475" font-size="21" font-weight="650" fill="#173f5b" text-anchor="start" >false positives</text>
<g fill="none" stroke="#173f5b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
 <path d="M481 311 L481 325" marker-end="url(#arrow)"/>
 <path d="M481 407 L481 421" marker-end="url(#arrow)"/>
 <path d="M481 487 C481 507 393 505 345 511"/>
</g>
</g>
<g id="shared-goal" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M345 511 L345 528" stroke="#c44734" stroke-width="2.4" marker-end="url(#arrow-red)"/>
 <path d="M77 536 Q77 528 87 529 L602 531 Q613 531 612 542 L610 629 Q610 639 600 638 L87 640 Q77 640 78 629 Z" fill="#fbefdf" stroke="#173f5b" stroke-width="2.2"/>
</g>
<text x="345" y="553" font-size="16" font-weight="700" fill="#c44734" text-anchor="middle" letter-spacing="0.7">SHARED GOAL</text>
<text x="345" y="585" font-size="23" font-weight="700" fill="#173f5b" text-anchor="middle" >Of people who test positive,</text>
<text x="345" y="616" font-size="23" font-weight="700" fill="#173f5b" text-anchor="middle" >what fraction actually have the disease?</text>
<!-- Original pen-drawn magnifier, a question rather than an invented statistic. -->
<g transform="translate(111 575) rotate(-12)" fill="none" stroke="#c44734" stroke-width="2.3" stroke-linecap="round"><circle cx="0" cy="0" r="12"/><path d="M8 9 L20 21"/></g>
</g>
</svg>