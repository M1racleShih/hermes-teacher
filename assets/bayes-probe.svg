<text x="34" y="57" class="serif" font-size="30" font-weight="700" fill="#193b50">Which group counts?</text><text x="472" y="57" class="serif" font-size="30" font-weight="700" fill="#193b50">Now the group is given</text><text x="34" y="102" class="sans" font-size="21" font-weight="400" fill="#193b50">To find the share of positive tests</text><text x="34" y="131" class="sans" font-size="21" font-weight="400" fill="#193b50">that are true positives, divide by …?</text><text x="472" y="102" class="sans" font-size="21" font-weight="400" fill="#193b50">9 of these 30 students wear glasses.</text><text x="472" y="131" class="sans" font-size="21" font-weight="400" fill="#193b50">Which number is the denominator?</text><text x="55" y="295" class="sans" font-size="26" font-weight="650" fill="#193b50">“I don’t know.”</text><text x="493" y="295" class="sans" font-size="26" font-weight="650" fill="#193b50">“30.”</text>
